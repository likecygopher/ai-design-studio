packages:
  - "."

# pnpm 11 no longer reads package.json#pnpm; keep the previous allowBuilds list
# and add security overrides for vulnerable transitive dependencies.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: true

overrides:
  postcss: ">=8.5.23"
  nanoid: "^3.3.18"
  browserslist: ">=4.28.7"
  source-map-js: ">=1.2.2"
  deepmerge-ts: "^8.0.2"
  effect: "~3.20.0"
  baseline-browser-mapping: ">=2.11.0"
  sharp: ">=0.35.5"
