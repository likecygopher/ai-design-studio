name: CI

# Quality gate for the commercial platform baseline:
#   prisma generate + migrate deploy -> typecheck -> test -> build
# Mirrors docs/sdd/specs/2026-10-26-commercial-platform/design.md §10 and the
# Definition of Done in docs/sdd/constitution.md §3.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned to the `packageManager` field in package.json.
  PNPM_VERSION: 11.15.1
  NODE_VERSION: "24"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: midea
          POSTGRES_PASSWORD: midea
          POSTGRES_DB: midea_ai_studio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U midea -d midea_ai_studio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # CI-only values. The database service is reachable on localhost:5432.
      # AUTH_SECRET is generated per run (>=32 chars) so no secret is stored in
      # the repo. NODE_ENV=test reaches vitest; the build step overrides it back
      # to production, because Next.js must build in production mode.
      - name: Prepare CI environment
        run: |
          AUTH_SECRET="$(openssl rand -hex 32)"
          cat > .env <<EOF
          DATABASE_URL=postgresql://midea:midea@localhost:5432/midea_ai_studio?schema=public
          AUTH_SECRET=${AUTH_SECRET}
          NODE_ENV=test
          AUTH_TRUST_HOST=true
          READY_REQUIRE_WORKER=false
          EOF
          echo "AUTH_SECRET=${AUTH_SECRET}" >> "$GITHUB_ENV"
          echo "DATABASE_URL=postgresql://midea:midea@localhost:5432/midea_ai_studio?schema=public" >> "$GITHUB_ENV"

      - name: Dependency audit (production, high+)
        run: pnpm audit --prod --audit-level=high --registry=https://registry.npmjs.org

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        env:
          # Next.js only supports production/development for `next build`; the
          # step-level value wins over NODE_ENV=test from the generated .env.
          NODE_ENV: production
        run: pnpm build

      - name: Seed demo data for E2E
        env:
          NODE_ENV: test
        run: pnpm db:seed

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E smoke
        env:
          NODE_ENV: production
          PORT: "3000"
          E2E_BASE_URL: http://127.0.0.1:3000
        run: pnpm e2e
